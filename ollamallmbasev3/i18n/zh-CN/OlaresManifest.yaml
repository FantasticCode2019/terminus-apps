metadata:
  description: "通用 Ollama 引擎基座。在安装时通过环境变量选择任意 Ollama 库模型。 llm-init 与推理引擎通过 Common 共享运行状态，支持跨节点运行。"
  title: Ollama 引擎基座

spec:
  upgradeDescription: |
    v1.3.28：补齐 Ollama v0.33.1 → v0.40.16 的累计发布说明。引擎保持 v0.40.16，该版本已随应用 v1.3.27 发布。

    - v0.33.2–v0.33.3：报告缓存的提示词 token，遵循 GGUF 模型默认参数，并为 MLX 上的 Gemma 4 增加图像和音频支持。
    - v0.34.0–v0.34.4：新增 OpenAI 兼容的工具搜索和响应压缩；模型元数据暴露思考控制项；加快模型列表查询，将思考模型的结构化输出改为单次处理。从 safetensors 创建 GGUF 需使用 llama.cpp 转换和量化工具；`typical_p` 已弃用。
    - v0.35.0–v0.35.1：通过 `/v1/systemone` 支持决策模型及多模态 Clef；支持 Modelfile `CAPABILITY` 声明，修复 MLX 下载停滞。
    - v0.40.0–v0.40.4：Apple silicon 上受支持模型默认使用 MLX；新增决策模型 CLI 和 llama-server 多模态嵌入。v0.40.2 引入的后台模型迁移在 v0.40.3 暂停；已迁移模型保留备份，可能暂时增加磁盘占用。
    - v0.40.5–v0.40.13：新增 Nemotron 3.5、Flint、LFM3 及决策模型系列；Flint 和 LFM3 分别在 v0.40.9、v0.40.13 支持 Linux/Windows。改进推测解码、工具调用顺序、对话续接、流式错误报告以及客户端断开后的远端请求取消。
    - v0.40.14–v0.40.16：新增 MiMo V2.6、Ripple Preview；循环/视觉 GGUF 模型支持并发请求，修复 Qwen YaRN 处理。OpenAI 接口保留模型采样默认值；`/v1/responses` 遵循 `truncation`，默认不再静默截断；未安装模型时 `/v1/models` 返回空列表。

    上游平台专属功能（包括 Apple silicon MLX 和 macOS 语音）不代表在本 Linux 容器中可用。此版本区间还持续更新了 llama.cpp 和 MLX。

    https://github.com/ollama/ollama/releases
    https://github.com/ollama/ollama/compare/v0.33.1...v0.40.16

    v1.3.27：将 Ollama 从 v0.33.1 升级至 v0.40.16。

    Ollama v0.40.16 更新亮点：
    - 新增 Ripple Preview，这是一款面向 Agent 编程的 65B 稠密模型。
    - `/v1/responses` 遵循 `truncation` 参数，默认不再静默截断。
    - 未安装模型时，`/v1/models` 返回空列表而非 `null`。
    - 更新 llama.cpp。

    https://github.com/ollama/ollama/releases/tag/v0.40.16

    v1.3.26: 运行状态迁移到 Common，支持跨节点运行。优先使用 Common 中的配置，否则迁移本节点旧 Cache，或在 Common 初始化。 启动时重试读取共享脚本。

    v1.3.25: Model Console（llm-init）更新为 v1.7.26。Chart 向 llm-init 传递去掉 OLLAMA_KEEP_ALIVE 的 ENGINE_ARGS；OLLAMA_CONTEXT_LENGTH 会写入模型卡上下文窗口。

    v1.3.23: Model Console（llm-init）版本更新为 v1.7.21。

    v1.3.22: Model Console 升级到 llm-init v1.7.19。

    v1.3.20: Model Console 现在可以重启 Ollama daemon。llm-init 与 daemon 共享 appCache 下的 RUN_DIR，wrapper 改在 supervise_engine 下启动 `ollama serve`，因此在模型卡上修改 engine_args 会让 daemon 带着新参数重新起来。模型卡也会在 Pod 重启后保留——它落盘之后优先级高于应用设置里的 ENGINE_ARGS。

    将 Ollama 从 v0.32.15 升级至 v0.33.1。Chart 1.3.17。

    **更新内容**（与 Olares 相关）

    v0.33.1
    - MLX：支持 Qwen3.8 Flash Next
    - 更新 MLX 与 llama.cpp
    - mlxrunner：支持结构化输出
    - mlxrunner：从慢速存储加载模型时避免 Metal GPU 超时

    v0.33.0
    - 修复 Agent 客户端取消长预填充时卡住
    - 预填充恢复点在取消后仍保留，重试从中断处继续而非从头开始
    - 恢复的预填充不再记录不完整的恢复点（循环层模型不再从零重算）
    - 禁用 Claude Code 的 “tokens left” 系统消息，此前会在每次请求破坏 KV cache
    - 修复 macOS 假设导致 Linux/Windows 默认打包损坏
    - 更新 MLX 依赖

    v0.32.15
    - 缓存已解析的模型元数据，首 token 延迟大约减半
    - 修复流式解析中途出错后 chat/generate 卡住
    - Qwen 3.8 会规范化非开头的 system 消息
    - 更新 MLX 与 llama.cpp 依赖

    详细发布说明请访问：
    https://github.com/ollama/ollama/releases
  fullDescription: |
    **重要提示**  
    此应用是一个模板，不能单独使用。请按下方环境变量设置模型后，方可使用本应用提供模型服务。

    **环境变量设置指南**
    - `MODEL_SOURCE`：`ollama://<模型>:<标签>`。Ollama 模型库下载源，例如 `ollama://qwen3.5:2b` 或 `ollama://gemma3:27b`。可在 https://ollama.com/library 浏览模型。
    - `MODEL_NAME`：`<模型>:<标签>`。模型名称，取 `MODEL_SOURCE` 中 `ollama://` 之后的字符串，例如 `qwen3.5:2b`。此项也作为 OpenAI 别名。
    - `MODEL_MODE`：`chat` 或 `embedding`。对话模型选 `chat`，向量模型选 `embedding`。
    - `MODEL_SUPPORTS`：模型能力选项（Vision / Tools / Thinking / None）。请选择您的模型支持的功能，可在 ollama.com/library 查看模型能力。必填。
    - `ENGINE_ARGS`：`OLLAMA_KEEP_ALIVE=-1 OLLAMA_CONTEXT_LENGTH=65536 ...`。未设置时图表在 ollama 守护进程默认 `-1`（常驻显存）；llm-init 不转发此项。
    - `LOG_LEVEL`：`debug`、`info`、`warn` 或 `error`。llm-init 容器的日志等级。
    - `OLLAMA_REQUIRED_GPU_MEMORY`：`8Gi`、`8192` 或 `8192Mi`。模型所需显存。NVIDIA 下设置 `nvidia.com/gpumem`（MiB），Spark 下设置 pod 显存。

    **工作流程说明**
    首先，`llm-init` 从 Ollama 模型库拉取并准备模型，然后 Ollama 守护进程在模型准备好后启动服务。这两个部分独立运行但共享文件与进度信息。

    **技术栈说明**
    - **Ollama 守护进程**（11434 端口）：拉取并服务模型
    - **llm-init**（8090 端口）：驱动模型拉取、展示进度，并通过 OpenAI API 代理到 Ollama

    **加速器模式**
    | 模式           | 设备             | 说明                                                         |
    |----------------|------------------|--------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)       | 需设置 `OLLAMA_REQUIRED_GPU_MEMORY`；Ollama 默认使用 GPU     |
    | `nvidia-gb10`  | GPU (Spark)      | 类似上方，但显存由 pod 管理                                  |

    **模型存储**
    所有拉取的模型存储在共享目录 `appCommon/ollama`。所有 Ollama 应用共用此目录，按 digest 去重，避免重复占用存储。

    **资源建议**
    - CPU、内存和 GPU 数量随图表自动配置，磁盘配额为固定
    - 部署大模型（如 gemma3:27b）时，可在 `ENGINE_ARGS` 中设置 `OLLAMA_CONTEXT_LENGTH` 和 `OLLAMA_KV_CACHE_TYPE` 以平衡上下文长度与显存占用
