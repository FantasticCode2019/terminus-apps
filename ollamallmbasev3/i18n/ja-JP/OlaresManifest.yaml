metadata:
  description: "汎用 Ollama エンジンベース。インストール時に env で任意の Ollama ライブラリモデルを選択. llm-init と推論エンジンは Common を介して実行状態を共有し、異なるノードで動作できます。"
  title: Ollama Engine Base

spec:
  upgradeDescription: |
    v1.3.28: Ollama v0.33.1 → v0.40.16 の累積リリースノートを補完。エンジンはアプリ v1.3.27 で導入済みの v0.40.16 を維持します。

    - v0.33.2–v0.33.3: キャッシュ済みプロンプトトークンの報告、GGUF の既定値への対応、MLX 上の Gemma 4 画像・音声対応。
    - v0.34.0–v0.34.4: OpenAI 互換のツール検索と応答圧縮、モデルメタデータの思考制御、一覧取得の高速化、思考モデルの構造化出力を単一パス化。safetensors からの GGUF 作成には llama.cpp の変換・量子化ツールが必要。`typical_p` は非推奨。
    - v0.35.0–v0.35.1: `/v1/systemone` による意思決定モデルとマルチモーダル Clef、Modelfile の `CAPABILITY` 宣言、MLX ダウンロード停止の修正。
    - v0.40.0–v0.40.4: Apple silicon の対応モデルは MLX を標準使用。意思決定モデル CLI と llama-server のマルチモーダル埋め込みを追加。v0.40.2 のバックグラウンド移行は v0.40.3 で停止され、移行済みモデルのバックアップによりディスク使用量が一時的に増える場合があります。
    - v0.40.5–v0.40.13: Nemotron 3.5、Flint、LFM3、意思決定モデル群を追加。Flint は v0.40.9、LFM3 は v0.40.13 で Linux/Windows に対応。投機的デコード、ツール順序、会話継続、ストリーミングエラー報告、切断時のリモート要求キャンセルを改善。
    - v0.40.14–v0.40.16: MiMo V2.6、Ripple Preview、再帰型・視覚 GGUF モデルの同時要求、Qwen YaRN 修正。OpenAI エンドポイントはモデルのサンプリング既定値を維持し、`/v1/responses` は `truncation` に従い既定で無通知の切り詰めを行いません。モデル未導入時の `/v1/models` は空リストを返します。

    Apple silicon の MLX や macOS 音声など、プラットフォーム固有機能が本 Linux コンテナーで利用できるとは限りません。この期間には llama.cpp と MLX も継続的に更新されています。

    https://github.com/ollama/ollama/releases
    https://github.com/ollama/ollama/compare/v0.33.1...v0.40.16

    v1.3.27: Ollama を v0.33.1 から v0.40.16 にアップグレードしました。

    Ollama v0.40.16 の主な更新：
    - エージェントによるコーディング向けの 65B 密モデル、Ripple Preview を追加。
    - `/v1/responses` が `truncation` に従うようになり、デフォルトで通知なく切り詰める動作を廃止。
    - モデルがインストールされていない場合、`/v1/models` は `null` ではなく空のリストを返すように修正。
    - llama.cpp を更新。

    https://github.com/ollama/ollama/releases/tag/v0.40.16

    v1.3.26: 実行時の状態を Common に保存し、ノードをまたぐ動作に対応します。Common に既存の設定がある場合は優先して使用します。ない場合は、このノードの従来の Cache から移行するか、Common で状態を初期化します。 エンジン起動時に共有ヘルパースクリプトの読み取りに失敗した場合は、再試行します。

    v1.3.25: Model Console（llm-init）を v1.7.26 に更新。Chart は OLLAMA_KEEP_ALIVE を除いた ENGINE_ARGS を llm-init に渡し、OLLAMA_CONTEXT_LENGTH がモデルカードのコンテキスト長になります。

    v1.3.23: Model Console（llm-init）を v1.7.21 に更新しました。

    v1.3.22: Model Console を llm-init v1.7.19 にアップグレードしました。

    v1.3.20: Model Console から Ollama デーモンを再起動できるようになりました。llm-init とデーモンが appCache 配下の RUN_DIR を共有し、wrapper は supervise_engine のもとで `ollama serve` を起動するため、モデルカードの engine_args を変更するとデーモンが新しい値で起動し直します。モデルカードは Pod 再起動後も保持され、ディスク上のカードはアプリ設定の ENGINE_ARGS より優先されます。

    Ollama を v0.32.15 から v0.33.1 へアップグレード。Chart 1.3.17。

    **変更内容**（Olares 関連）

    v0.33.1
    - MLX: Qwen3.8 Flash Next サポート
    - MLX および llama.cpp の更新
    - mlxrunner: 構造化出力サポート
    - mlxrunner: 低速ストレージからのモデル読み込み時の Metal GPU タイムアウト回避

    v0.33.0
    - エージェントクライアントが長い prefill をキャンセルしたときのハングを修正
    - Prefill 復元ポイントがキャンセル後も残り、リトライが最初からではなく再開する
    - 再開された prefill が不完全な復元ポイントを記録しなくなった（再帰層モデルがゼロから再処理しない）
    - 毎リクエストで KV キャッシュを壊していた Claude Code の「tokens left」システムメッセージを無効化
    - macOS 固有の前提で壊れていた Linux/Windows デフォルトパッケージングを修正
    - MLX 依存関係の更新

    v0.32.15
    - 解決済みモデルメタデータをリクエスト間でキャッシュし、time-to-first-token をおよそ半分に短縮
    - ストリーム途中のパーサーエラー後の chat/generate ハングを修正
    - Qwen 3.8 のシステムメッセージを正規化し、先頭以外のシステムメッセージも一貫処理
    - MLX および llama.cpp 依存関係の更新

    詳細なリリースノート:
    https://github.com/ollama/ollama/releases
  fullDescription: |
    **重要なお知らせ**  
    このアプリはテンプレートであり、単体では使えません。下の環境変数を設定して特定モデルを接続してください。

    **環境変数セットアップガイド**
    - `MODEL_SOURCE`: `ollama://<model>:<tag>`。モデルを pull する Ollama ライブラリソース。例: `ollama://qwen3.5:2b` または `ollama://gemma3:27b`。モデル一覧： https://ollama.com/library
    - `MODEL_NAME`: `<model>:<tag>`。モデル名 — `MODEL_SOURCE` の `ollama://` 以降の文字列。例: `qwen3.5:2b`。OpenAI エイリアスとしても使用。
    - `MODEL_MODE`: `chat` または `embedding`。会話モデルは `chat`、埋め込みモデルは `embedding`。
    - `MODEL_SUPPORTS`: モデル能力（Vision / Tools / Thinking / None）。モデルが対応するものを選択。ollama.com/library のモデルページで確認。
    - `ENGINE_ARGS`: `OLLAMA_KEEP_ALIVE=-1 OLLAMA_CONTEXT_LENGTH=65536 ...`。チャートのデフォルトは ollama デーモンの `-1`（VRAM に常駐）; llm-init からは転送されません。
    - `LOG_LEVEL`: `debug`、`info`、`warn`、または `error`。llm-init コンテナのログレベル。
    - `OLLAMA_REQUIRED_GPU_MEMORY`: `8Gi`、`8192`、または `8192Mi`。必要なモデルメモリ。NVIDIA では MiB 単位の `nvidia.com/gpumem` を設定; Spark ではポッドメモリを設定。

    **動作の仕組み**
    まず `llm-init` が Ollama ライブラリからモデルを pull して準備し、準備ができたら Ollama デーモンがサービングを開始します。両者は別々に動作しますが、ファイルと進捗情報を共有します。

    **スタック**
    - **Ollama デーモン**（ポート 11434）: モデルの pull とサーブ
    - **llm-init**（ポート 8090）: モデル pull を駆動し、進捗を表示し、OpenAI API を提供して Ollama へプロキシ

    **アクセラレータモード**
    | モード         | デバイス          | 詳細                                                                 |
    |----------------|-------------------|----------------------------------------------------------------------|
    | `nvidia`       | GPU (CUDA)        | `OLLAMA_REQUIRED_GPU_MEMORY` を設定; Ollama はデフォルトで GPU 使用  |
    | `nvidia-gb10`  | GPU (Spark)       | 上記と同様だがメモリはポッドが管理                                   |

    **モデルストレージ**
    pull したモデルはすべて共有フォルダ `appCommon/ollama` に保存。Ollama ベースのアプリはこの場所を共有し、ダイジェストでブロブがインストール間で重複排除されます。

    **リソースのヒント**
    - CPU、RAM、GPU はチャートに基づき自動設定; ディスク設定は固定。
    - 大規模モデル（例: gemma3:27b）では `ENGINE_ARGS` で `OLLAMA_CONTEXT_LENGTH` と `OLLAMA_KV_CACHE_TYPE` を設定し、コンテキスト長と VRAM 使用をバランス。
